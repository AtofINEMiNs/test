<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <title>APR Doubling Calculator</title>

  <!-- PWA / Add to Home Screen -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="2× Calc" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.json" />
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #1a0a00;
      --surface: #2a1500;
      --surface2: #3a1f00;
      --accent: #ff6d00;
      --accent2: #ffab40;
      --text: #fff8f0;
      --muted: #9e7a4a;
      --success: #ffab40;
      --border: #4a2e00;
      --radius: 20px;
    }

    html, body {
      height: 100%;
      overscroll-behavior: none;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: calc(12px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom));
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 20px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.5);
      user-select: none;
      -webkit-user-select: none;
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .logo {
      width: 36px;
      height: 36px;
      flex-shrink: 0;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    h1 {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .subtitle {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.4;
    }

    .input-group {
      position: relative;
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 10px;
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .apr-display {
      width: 100%;
      background: var(--surface2);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 26px;
      font-weight: 700;
      padding: 12px 48px 12px 16px;
      transition: border-color 0.2s, box-shadow 0.2s;
      cursor: default;
      user-select: none;
      display: flex;
      align-items: center;
    }

    .apr-display.placeholder {
      color: var(--muted);
      font-weight: 400;
      font-size: 24px;
    }

    .apr-display.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(108, 99, 255, 0.2);
    }

    .numpad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-top: 8px;
    }

    .numpad-btn {
      background: var(--surface2);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 18px;
      font-weight: 600;
      padding: 10px 0;
      text-align: center;
      cursor: pointer;
      transition: background 0.1s, transform 0.1s;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .numpad-btn:active {
      background: var(--accent);
      color: #fff;
      transform: scale(0.95);
    }

    .numpad-btn.del {
      color: var(--accent2);
      font-size: 18px;
    }

    .unit {
      position: absolute;
      right: 18px;
      font-size: 20px;
      font-weight: 700;
      color: var(--accent2);
      pointer-events: none;
    }

    .compounding-row {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
    }

    .pill {
      flex: 1;
      padding: 7px 4px;
      border-radius: 8px;
      border: 1.5px solid var(--border);
      background: var(--surface2);
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s;
      letter-spacing: 0.3px;
    }

    .pill.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .pill:hover:not(.active) {
      border-color: var(--accent2);
      color: var(--text);
    }

    /* Result */
    .result {
      background: var(--surface2);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      text-align: center;
      margin-top: 0;
      min-height: 130px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: all 0.3s;
    }

    .result.has-value {
      border-color: var(--accent);
      background: linear-gradient(135deg, rgba(108,99,255,0.08), rgba(167,139,250,0.05));
    }

    .result-label {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      margin-bottom: 16px;
      width: 100%;
      text-align: center;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      width: 100%;
    }

    .stat {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 6px;
      text-align: center;
    }

    .stat-value {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -1px;
      line-height: 1;
      background: linear-gradient(135deg, #fff 30%, var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .stat-unit {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--muted);
      margin-top: 3px;
    }

    .stat-total {
      margin-top: 8px;
      font-size: 12px;
      color: var(--muted);
      width: 100%;
      text-align: center;
    }

    .stat-total strong {
      color: var(--accent2);
    }

    .placeholder-text {
      color: var(--muted);
      font-size: 15px;
    }

    .rule72 {
      margin-top: 8px;
      min-height: 1.6em;
      font-size: 11px;
      color: var(--muted);
      text-align: center;
      line-height: 1.6;
    }

    .rule72 strong {
      color: var(--accent2);
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f0fff4;
        --surface: #ffffff;
        --surface2: #e8f5e9;
        --text: #0a2e14;
        --muted: #4a7a5a;
        --border: #b2dfdb;
      }
      .stat-value {
        background: linear-gradient(135deg, #0a2e14 30%, var(--accent));
        -webkit-background-clip: text;
        background-clip: text;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-header">
      <div class="logo">2×</div>
      <div>
        <h1>Doubling Calculator</h1>
        <p class="subtitle">How long for your money to double?</p>
      </div>
    </div>

    <div class="input-group">
      <label>Annual Percentage Rate</label>
      <div class="input-wrap">
        <div class="apr-display placeholder" id="aprDisplay">0.00</div>
        <span class="unit">%</span>
      </div>
      <div class="numpad">
        <button class="numpad-btn" data-k="7">7</button>
        <button class="numpad-btn" data-k="8">8</button>
        <button class="numpad-btn" data-k="9">9</button>
        <button class="numpad-btn" data-k="4">4</button>
        <button class="numpad-btn" data-k="5">5</button>
        <button class="numpad-btn" data-k="6">6</button>
        <button class="numpad-btn" data-k="1">1</button>
        <button class="numpad-btn" data-k="2">2</button>
        <button class="numpad-btn" data-k="3">3</button>
        <button class="numpad-btn" data-k=".">.</button>
        <button class="numpad-btn" data-k="0">0</button>
        <button class="numpad-btn del" data-k="del">⌫</button>
      </div>
    </div>

    <label style="margin-bottom:6px">Compounding</label>
    <div class="compounding-row">
      <div class="pill" data-n="1">Annual</div>
      <div class="pill" data-n="12" id="defaultPill">Monthly</div>
      <div class="pill" data-n="365">Daily</div>
    </div>

    <div class="result" id="result">
      <p class="placeholder-text">Enter an APR above ↑</p>
    </div>

  </div>

  <script>
    const display = document.getElementById('aprDisplay');
    const resultBox = document.getElementById('result');
    const pills = document.querySelectorAll('.pill');
    let n = 12;
    let raw = ''; // string of digits/dot entered

    function updateDisplay() {
      if (!raw) {
        display.textContent = '0.00';
        display.classList.add('placeholder');
      } else {
        display.textContent = raw;
        display.classList.remove('placeholder');
      }
    }

    document.querySelectorAll('.numpad-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const k = btn.dataset.k;
        if (k === 'del') {
          raw = raw.slice(0, -1);
        } else if (k === '.') {
          if (!raw.includes('.')) raw += '.';
        } else {
          if (raw === '0') raw = k;
          else if (raw.length < 6) raw += k;
        }
        updateDisplay();
        calculate();
      });
    });

    // Set active pill
    function setActivePill(val) {
      pills.forEach(p => {
        p.classList.toggle('active', Number(p.dataset.n) === val);
      });
      n = val;
      calculate();
    }

    // Init default
    setActivePill(12);

    pills.forEach(p => {
      p.addEventListener('click', () => setActivePill(Number(p.dataset.n)));
    });

    function calculate() {
      const apr = parseFloat(raw);

      if (!apr || apr <= 0) {
        resultBox.className = 'result';
        resultBox.innerHTML = '<p class="placeholder-text">Enter an APR above ↑</p>';
        return;
      }

      const r = apr / 100;
      // t in years: 2 = (1 + r/n)^(n*t)
      const t_years = Math.log(2) / (n * Math.log(1 + r / n));

      const totalDays = Math.round(t_years * 365.25);
      const years  = Math.floor(totalDays / 365);
      const months = Math.floor((totalDays % 365) / 30);
      const days   = totalDays % 30;

      // Build readable parts
      const parts = [];
      if (years  > 0) parts.push(`${years} yr${years  !== 1 ? 's' : ''}`);
      if (months > 0) parts.push(`${months} mo`);
      if (days   > 0) parts.push(`${days} day${days !== 1 ? 's' : ''}`);

      const totalMonths = Math.floor(t_years * 12);
      const remDays     = Math.round((t_years * 12 - totalMonths) * 30.44);

      // Rule of 72 hint
      const r72 = (72 / apr).toFixed(1);

      resultBox.className = 'result has-value';
      resultBox.innerHTML = `
        <div class="result-label">Time to 2×</div>
        <div class="stat-grid">
          <div class="stat">
            <div class="stat-value">${years}</div>
            <div class="stat-unit">Year${years !== 1 ? 's' : ''}</div>
          </div>
          <div class="stat">
            <div class="stat-value">${months}</div>
            <div class="stat-unit">Months</div>
          </div>
          <div class="stat">
            <div class="stat-value">${days}</div>
            <div class="stat-unit">Days</div>
          </div>
        </div>
        <div class="stat-total">Total: <strong>${totalMonths} months</strong> and <strong>${remDays} days</strong></div>
      `;
    }
  </script>
</body>
</html>
