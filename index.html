<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <title>APR Doubling Calculator</title>

  <!-- PWA / Add to Home Screen -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="2× Calc" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.json" />
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #1a0a00;
      --surface: #2a1500;
      --surface2: #3a1f00;
      --accent: #ff6d00;
      --accent2: #ffab40;
      --text: #fff8f0;
      --muted: #9e7a4a;
      --success: #ffab40;
      --border: #4a2e00;
      --radius: 20px;
    }

    html, body {
      height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: calc(24px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 36px 28px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.5);
    }

    .logo {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 32px;
      line-height: 1.5;
    }

    .input-group {
      position: relative;
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 10px;
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    input[type="number"] {
      width: 100%;
      background: var(--surface2);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      color: var(--text);
      font-size: 28px;
      font-weight: 700;
      padding: 18px 52px 18px 20px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      -moz-appearance: textfield;
      appearance: textfield;
    }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
    }

    input[type="number"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(108, 99, 255, 0.2);
    }

    input[type="number"]::placeholder {
      color: var(--muted);
      font-weight: 400;
      font-size: 24px;
    }

    .unit {
      position: absolute;
      right: 18px;
      font-size: 20px;
      font-weight: 700;
      color: var(--accent2);
      pointer-events: none;
    }

    .compounding-row {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }

    .pill {
      flex: 1;
      padding: 10px 4px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      background: var(--surface2);
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s;
      letter-spacing: 0.3px;
    }

    .pill.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .pill:hover:not(.active) {
      border-color: var(--accent2);
      color: var(--text);
    }

    /* Result */
    .result {
      background: var(--surface2);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 24px 20px;
      text-align: center;
      margin-top: 8px;
      min-height: 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: all 0.3s;
    }

    .result.has-value {
      border-color: var(--accent);
      background: linear-gradient(135deg, rgba(108,99,255,0.08), rgba(167,139,250,0.05));
    }

    .result-label {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .result-main {
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -1px;
      line-height: 1.1;
      background: linear-gradient(135deg, #fff 30%, var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .result-sub {
      font-size: 14px;
      color: var(--muted);
      margin-top: 8px;
    }

    .result-sub span {
      color: var(--success);
      font-weight: 600;
    }

    .placeholder-text {
      color: var(--muted);
      font-size: 15px;
    }

    .divider {
      width: 40px;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 2px;
      margin: 12px auto 0;
    }

    .rule72 {
      margin-top: 16px;
      font-size: 12px;
      color: var(--muted);
      text-align: center;
      line-height: 1.6;
    }

    .rule72 strong {
      color: var(--accent2);
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f0fff4;
        --surface: #ffffff;
        --surface2: #e8f5e9;
        --text: #0a2e14;
        --muted: #4a7a5a;
        --border: #b2dfdb;
      }
      .result-main {
        background: linear-gradient(135deg, #0a2e14 30%, var(--accent));
        -webkit-background-clip: text;
        background-clip: text;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">2×</div>
    <h1>Doubling Calculator</h1>
    <p class="subtitle">Enter an APR to see how long it takes your money to double.</p>

    <div class="input-group">
      <label>Annual Percentage Rate</label>
      <div class="input-wrap">
        <input
          type="number"
          id="aprInput"
          placeholder="0.00"
          min="0.01"
          max="999"
          step="0.01"
          inputmode="decimal"
          autofocus
        />
        <span class="unit">%</span>
      </div>
    </div>

    <label style="margin-bottom:10px">Compounding</label>
    <div class="compounding-row">
      <div class="pill" data-n="1">Annual</div>
      <div class="pill" data-n="12" id="defaultPill">Monthly</div>
      <div class="pill" data-n="365">Daily</div>
    </div>

    <div class="result" id="result">
      <p class="placeholder-text">Enter an APR above ↑</p>
    </div>

    <p class="rule72" id="rule72hint"></p>
  </div>

  <script>
    const input = document.getElementById('aprInput');
    const resultBox = document.getElementById('result');
    const rule72hint = document.getElementById('rule72hint');
    const pills = document.querySelectorAll('.pill');
    let n = 12; // default: monthly

    // Set active pill
    function setActivePill(val) {
      pills.forEach(p => {
        p.classList.toggle('active', Number(p.dataset.n) === val);
      });
      n = val;
      calculate();
    }

    // Init default
    setActivePill(12);

    pills.forEach(p => {
      p.addEventListener('click', () => setActivePill(Number(p.dataset.n)));
    });

    input.addEventListener('input', calculate);

    function calculate() {
      const apr = parseFloat(input.value);

      if (!apr || apr <= 0) {
        resultBox.className = 'result';
        resultBox.innerHTML = '<p class="placeholder-text">Enter an APR above ↑</p>';
        rule72hint.textContent = '';
        return;
      }

      const r = apr / 100;
      // t in years: 2 = (1 + r/n)^(n*t)
      const t_years = Math.log(2) / (n * Math.log(1 + r / n));

      const totalDays = Math.round(t_years * 365.25);
      const years  = Math.floor(totalDays / 365);
      const months = Math.floor((totalDays % 365) / 30);
      const days   = totalDays % 30;

      // Build readable parts
      const parts = [];
      if (years  > 0) parts.push(`${years} yr${years  !== 1 ? 's' : ''}`);
      if (months > 0) parts.push(`${months} mo`);
      if (days   > 0) parts.push(`${days} day${days !== 1 ? 's' : ''}`);

      const totalMonths = Math.floor(t_years * 12);
      const remDays     = Math.round((t_years * 12 - totalMonths) * 30.44);

      // Rule of 72 hint
      const r72 = (72 / apr).toFixed(1);
      rule72hint.innerHTML = `Rule of 72 estimate: <strong>${r72} yrs</strong> &nbsp;·&nbsp; Exact: <strong>${(t_years).toFixed(2)} yrs</strong>`;

      resultBox.className = 'result has-value';
      resultBox.innerHTML = `
        <div class="result-label">Time to 2×</div>
        <div class="result-main">${parts.join(' ')}</div>
        <div class="result-sub">
          <span>${totalMonths} months</span> and ${remDays} days
        </div>
        <div class="divider"></div>
      `;
    }
  </script>
</body>
</html>
