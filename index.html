<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <title>APR Doubling Calculator</title>

  <!-- PWA / Add to Home Screen -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="2× Calc" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.json" />
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #1a0a00;
      --surface: #2a1500;
      --surface2: #3a1f00;
      --accent: #ff6d00;
      --accent2: #ffab40;
      --text: #fff8f0;
      --muted: #9e7a4a;
      --success: #ffab40;
      --border: #4a2e00;
      --radius: 20px;
    }

    html, body {
      height: 100%;
      overscroll-behavior: none;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: calc(12px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom));
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 20px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.5);
      user-select: none;
      -webkit-user-select: none;
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .logo {
      width: 36px;
      height: 36px;
      flex-shrink: 0;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    h1 {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .subtitle {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.4;
    }

    .input-group {
      position: relative;
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 10px;
    }

    /* Roller picker */
    .roller-picker {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .roller-window {
      position: relative;
      flex: 1;
      height: 180px;
      overflow: hidden;
      border-radius: 14px;
      background: var(--surface2);
      border: 1.5px solid var(--border);
      touch-action: none;
      cursor: grab;
    }

    .roller-window::before,
    .roller-window::after {
      content: '';
      position: absolute;
      left: 0; right: 0;
      height: 66px;
      z-index: 2;
      pointer-events: none;
    }

    .roller-window::before {
      top: 0;
      background: linear-gradient(to bottom, var(--surface2) 20%, transparent);
    }

    .roller-window::after {
      bottom: 0;
      background: linear-gradient(to top, var(--surface2) 20%, transparent);
    }

    .roller-highlight {
      position: absolute;
      top: 60px;
      left: 12px; right: 12px;
      height: 60px;
      border-radius: 10px;
      background: rgba(255,109,0,0.1);
      border: 1.5px solid var(--accent);
      pointer-events: none;
      z-index: 1;
    }

    .roller-drum {
      position: absolute;
      width: 100%;
      will-change: transform;
    }

    .roller-item {
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 700;
      color: var(--muted);
      transition: font-size 0.15s, color 0.15s;
    }

    .roller-item.active {
      color: var(--text);
      font-size: 48px;
    }

    .roller-pct {
      font-size: 28px;
      font-weight: 800;
      color: var(--accent2);
      flex-shrink: 0;
    }

    .compounding-row {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
    }

    .pill {
      flex: 1;
      padding: 7px 4px;
      border-radius: 8px;
      border: 1.5px solid var(--border);
      background: var(--surface2);
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s;
      letter-spacing: 0.3px;
    }

    .pill.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .pill:hover:not(.active) {
      border-color: var(--accent2);
      color: var(--text);
    }

    /* Result */
    .result {
      background: var(--surface2);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      text-align: center;
      margin-top: 0;
      height: 160px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: all 0.3s;
    }

    .result.has-value {
      border-color: var(--accent);
      background: linear-gradient(135deg, rgba(108,99,255,0.08), rgba(167,139,250,0.05));
    }

    .result-label {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      margin-bottom: 16px;
      width: 100%;
      text-align: center;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      width: 100%;
    }

    .stat {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 6px;
      text-align: center;
    }

    .stat-value {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -1px;
      line-height: 1;
      background: linear-gradient(135deg, #fff 30%, var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .stat-unit {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--muted);
      margin-top: 3px;
    }

    .stat-total {
      margin-top: 8px;
      font-size: 12px;
      color: var(--muted);
      width: 100%;
      text-align: center;
    }

    .stat-total strong {
      color: var(--accent2);
    }

    .placeholder-text {
      color: var(--muted);
      font-size: 15px;
    }

    .rule72 {
      margin-top: 8px;
      min-height: 1.6em;
      font-size: 11px;
      color: var(--muted);
      text-align: center;
      line-height: 1.6;
    }

    .rule72 strong {
      color: var(--accent2);
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f0fff4;
        --surface: #ffffff;
        --surface2: #e8f5e9;
        --text: #0a2e14;
        --muted: #4a7a5a;
        --border: #b2dfdb;
      }
      .stat-value {
        background: linear-gradient(135deg, #0a2e14 30%, var(--accent));
        -webkit-background-clip: text;
        background-clip: text;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-header">
      <div class="logo">2×</div>
      <div>
        <h1>Doubling Calculator</h1>
        <p class="subtitle">How long for your money to double?</p>
      </div>
    </div>

    <div class="input-group">
      <label>Annual Percentage Rate</label>
      <div class="roller-picker">
        <div class="roller-window" id="rollerAPR">
          <div class="roller-highlight"></div>
          <div class="roller-drum" id="drumAPR"></div>
        </div>
        <span class="roller-pct">%</span>
      </div>
    </div>

    <label style="margin-bottom:6px">Compounding</label>
    <div class="compounding-row">
      <div class="pill" data-n="1">Annual</div>
      <div class="pill" data-n="12" id="defaultPill">Monthly</div>
      <div class="pill" data-n="365">Daily</div>
    </div>

    <div class="result" id="result">
      <p class="placeholder-text">Enter an APR above ↑</p>
    </div>

  </div>

  <script>
    const resultBox = document.getElementById('result');
    const pills = document.querySelectorAll('.pill');
    let n = 12;

    const ITEM_H = 60;
    const PAD = 1;
    const COUNT = 3000;

    function buildRoller(windowEl, drumEl, count, initial, onChange) {
      let index = initial;
      let dragY = null;
      let dragStartIdx = null;
      let lastY = null;
      let lastT = null;
      let velocity = 0;

      for (let i = 0; i < count + PAD * 2; i++) {
        const div = document.createElement('div');
        div.className = 'roller-item';
        const ri = i - PAD;
        if (ri >= 0 && ri < count) div.textContent = ri + 1;
        drumEl.appendChild(div);
      }

      // Center item[idx] in the middle slot (slot 1 of 3)
      function offsetFor(idx) { return -idx * ITEM_H; }

      function setOffset(v, animated) {
        drumEl.style.transition = animated ? 'transform 0.35s cubic-bezier(0.25,0.8,0.25,1)' : 'none';
        drumEl.style.transform = `translateY(${v}px)`;
      }

      function markActive(floatIdx) {
        const rounded = Math.max(0, Math.min(count - 1, Math.round(floatIdx)));
        drumEl.querySelectorAll('.roller-item').forEach((el, i) => {
          el.classList.toggle('active', i === rounded + PAD);
        });
      }

      function goTo(idx, animated) {
        index = Math.max(0, Math.min(count - 1, Math.round(idx)));
        setOffset(offsetFor(index), animated);
        markActive(index);
        onChange(index + 1);
      }

      windowEl.addEventListener('touchstart', e => {
        dragY = e.touches[0].clientY;
        dragStartIdx = index;
        lastY = dragY; lastT = Date.now();
        velocity = 0;
        drumEl.style.transition = 'none';
      }, { passive: true });

      windowEl.addEventListener('touchmove', e => {
        if (dragY === null) return;
        const y = e.touches[0].clientY;
        const now = Date.now();
        const dt = now - lastT;
        if (dt > 0) velocity = (y - lastY) / dt;
        lastY = y; lastT = now;
        const floatIdx = Math.max(0, Math.min(count - 1, dragStartIdx - (y - dragY) / ITEM_H));
        setOffset(offsetFor(floatIdx), false);
        markActive(floatIdx);
      }, { passive: true });

      windowEl.addEventListener('touchend', e => {
        if (dragY === null) return;
        const dy = e.changedTouches[0].clientY - dragY;
        dragY = null;
        // Add momentum: flick velocity carries scroll further
        const momentum = -(velocity * 120) / ITEM_H;
        goTo(dragStartIdx - dy / ITEM_H + momentum, true);
      }, { passive: true });

      windowEl.addEventListener('wheel', e => {
        e.preventDefault();
        goTo(index + (e.deltaY > 0 ? 1 : -1), true);
      }, { passive: false });

      goTo(initial, false);
      return { getIndex: () => index + 1 };
    }

    const aprRoller = buildRoller(
      document.getElementById('rollerAPR'),
      document.getElementById('drumAPR'),
      COUNT, 4,   // index 4 → value 5
      () => calculate()
    );

    function setActivePill(val) {
      pills.forEach(p => p.classList.toggle('active', Number(p.dataset.n) === val));
      n = val;
      calculate();
    }

    setActivePill(12);
    pills.forEach(p => p.addEventListener('click', () => setActivePill(Number(p.dataset.n))));

    function calculate() {
      const apr = aprRoller.getIndex();

      if (!apr || apr <= 0) return;

      const r = apr / 100;
      const t_years = Math.log(2) / (n * Math.log(1 + r / n));
      const totalDays = Math.round(t_years * 365.25);
      const years  = Math.floor(totalDays / 365);
      const months = Math.floor((totalDays % 365) / 30);
      const days   = totalDays % 30;
      const totalMonths = Math.floor(t_years * 12);
      const remDays     = Math.round((t_years * 12 - totalMonths) * 30.44);

      resultBox.className = 'result has-value';
      resultBox.innerHTML = `
        <div class="result-label">Time to 2×</div>
        <div class="stat-grid">
          <div class="stat">
            <div class="stat-value">${years}</div>
            <div class="stat-unit">Year${years !== 1 ? 's' : ''}</div>
          </div>
          <div class="stat">
            <div class="stat-value">${months}</div>
            <div class="stat-unit">Months</div>
          </div>
          <div class="stat">
            <div class="stat-value">${days}</div>
            <div class="stat-unit">Days</div>
          </div>
        </div>
        <div class="stat-total">Total: <strong>${totalMonths} months</strong> and <strong>${remDays} days</strong></div>
      `;
    }
  </script>
</body>
</html>
